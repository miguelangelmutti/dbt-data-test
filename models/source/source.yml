version: 2

sources:
  - name: raw_car_sales
    database: DATABOOSTERS
    schema: DBT_MMUTTI
    tables:
           - name: car_sales
             description: Tabla de datos de ventas desde DATABOOSTERS transaccional
             columns:
                  - name: DDATE
                    description: fecha de venta de la columna
                  - name: SALESPERSON
                    description: "nombre del vendedor"
                    tests:
                      - not_null
                  - name: CUSTOMERNAME
                    description: "nombre del cliente"
                  - name: CARMAKE
                    description: "marca del vehiculo"
                  - name: CARMODEL
                    description: "modelo del vehiculo"
                  - name: CARYEAR
                    description: "año del vehiculo"
                  - name: SALEPRICE
                    description: "precio de venta"
                  - name: COMMISSIONRATE
                    description: "tasa de comision cobrada por el vendedor"
                  - name: COMMISSIONEARNED
                    description: "monto de la comision"
  - name: snowflake_salesperson
    database: DATABOOSTERS
    schema: PUBLIC
    tables:
           - name: SALESPERSON
             description: Vendedores de autos con la informacion de comision, sucursal donde venden, status 
             columns:
                  - name: salesperson_id
                    description: id del vendedor
                  - name: SALESPERSON
                    description: nombre del vendedor
                    tests:
                      - not_null
                  - name: comission_rate
                    description: comision del vendedor
                  - name: store_id
                    description: id de la sucursal
                  - name: last_updated_ts
                    description: ultima actualizacion
                 

